[package]
name = "axomai_browser"
version = "4.0.0"
edition = "2021"
authors = ["Samarjit Kashyap <samarjitkashyp@gmail.com>"]
description = "Axomai Browser - Fast, Private, AI-Powered Native Web Browser"

[dependencies]
tao = "0.28"
wgpu = "0.19"
pollster = "0.3"
axomai_engine = { path = "../native/rust_engine", features = ["wgpu-backend"] }
wry = "0.49"
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = { version = "0.45", default-features = false }
qrcode = { version = "0.14", default-features = false }
ureq = "2.9"
rfd = { version = "0.14", default-features = false }
sha2 = "0.10"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.35"
windows = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse"] }
