[package]
name = "axomai_browser"
version = "1.6.0"
edition = "2021"
authors = ["Samarjit Kashyap <samarjitkashyp@gmail.com>"]
description = "Axomai Browser - Fast, Private, AI-Powered Native Web Browser"

[dependencies]
tao = "0.28"
wgpu = "0.19"
pollster = "0.3"
axomai_engine = { path = "../native/rust_engine", features = ["wgpu-backend"] }
wry = "0.49"
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
