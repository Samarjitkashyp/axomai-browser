name: Axomai Browser CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Engine Cargo Test
        run: cargo test --manifest-path native/rust_engine/Cargo.toml --all-targets

      - name: Build Rust Desktop Shell
        run: cargo check --manifest-path rust_desktop/Cargo.toml
