# Goes inside the server { } block of /etc/nginx/conf.d/axomai-browser.aiaxom.co.in.conf, before "location / {".
# The address is only known to the owner; the page and the API are also protected by a password.

    location = /admin-browser-axom {
        return 301 /admin-browser-axom/;
    }

    location /admin-browser-axom/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8012/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
        proxy_buffering off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
