<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#059669">
<title>Axomai admin</title>
<style>
:root{--acc:#10b981;--acc2:#059669;--bg:#f2f6f4;--card:#fff;--text:#0f2a22;--muted:#5b6b66;--line:#d6e3dd;--danger:#dc2626;--soft:#e6f7ef;--shadow:0 12px 40px rgba(5,150,105,.14);--bar:56px}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111c2e;--text:#e2e8f0;--muted:#94a3b8;--line:#22324a;--soft:#12302a;--shadow:0 12px 40px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;transition:filter .15s,transform .05s;min-height:42px}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(1px)}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.alt:hover{background:var(--soft);filter:none}
.btn.sm{padding:6px 12px;font-size:.84rem;min-height:34px;border-radius:9px}.btn:disabled{opacity:.5;cursor:default}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}

/* ---------------- login ---------------- */
body.loginmode{background:radial-gradient(900px 500px at 20% -10%,rgba(16,185,129,.28),transparent 60%),radial-gradient(700px 420px at 100% 100%,rgba(245,158,11,.16),transparent 60%),var(--bg)}
#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
.lcard{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:34px 28px 26px;box-shadow:var(--shadow);text-align:center}
.lcard .logo{width:72px;height:72px;border-radius:18px;box-shadow:0 10px 26px rgba(5,150,105,.3);margin-bottom:14px}
.lcard h1{margin:0 0 4px;font-size:1.45rem;letter-spacing:-.01em}
.lsub{margin:0 0 22px;color:var(--muted)}
#loginForm{text-align:left}
#loginForm label{display:block;font-weight:700;font-size:.85rem;margin:0 0 6px}
.pwwrap{position:relative}
.pwwrap input{width:100%;padding:13px 70px 13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px}
.pwwrap input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(16,185,129,.18)}
.pwwrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--acc2);font-weight:700;padding:8px 10px;border-radius:8px;cursor:pointer}
.err{color:var(--danger);min-height:1.5em;margin:8px 0 6px;font-size:.9rem}
.err.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#loginBtn{width:100%;padding:13px;font-size:1rem}
.lfoot{margin:18px 0 0;font-size:.8rem;color:var(--muted);text-align:center}

/* ---------------- app ---------------- */
header.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 18px;min-height:var(--bar);background:var(--card);border-bottom:1px solid var(--line)}
header.bar h1{font-size:1.05rem;margin:0;display:flex;align-items:center;gap:10px;flex:1;min-width:0}
header.bar h1 img{width:30px;height:30px;border-radius:8px}
#dirty{font-size:.82rem;color:var(--muted);white-space:nowrap}#dirty.on{color:#b45309;font-weight:700}
@media (prefers-color-scheme:dark){#dirty.on{color:#fbbf24}}
.actions{display:flex;gap:8px;align-items:center}
.layout{display:grid;grid-template-columns:230px 1fr;gap:22px;max-width:1300px;margin:0 auto;padding:20px 18px 60px}
nav.tabs{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(var(--bar) + 16px);align-self:start}
nav.tabs button{text-align:left;padding:11px 14px;border:0;border-radius:11px;background:transparent;cursor:pointer;font-weight:600;color:var(--muted)}
nav.tabs button:hover{background:var(--soft)}nav.tabs button.on{background:var(--acc);color:#fff}
nav.tabs hr{border:0;border-top:1px solid var(--line);width:100%;margin:6px 0}
main{min-width:0}
main h2{margin:0 0 4px;font-size:1.5rem}.sub{color:var(--muted);margin:0 0 16px}
.field{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.flabel{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:700;margin-bottom:8px}
.flabel small{font-weight:400;color:var(--muted);text-align:right}
.field.changed{border-left:4px solid var(--acc)}
textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);resize:vertical;min-height:42px;line-height:1.45;font-size:16px}
textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(16,185,129,.16)}
textarea[disabled]{opacity:.6}
.row{display:grid;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:12px;margin-bottom:10px}
.row .tools{display:flex;gap:6px;justify-content:flex-end;grid-column:1/-1}
.cols1{grid-template-columns:1fr}.cols2{grid-template-columns:1fr 1.6fr}.cols3{grid-template-columns:1fr 1fr 1.6fr}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--bg)}
.card h4{margin:0 0 8px}
.mini{font-size:.8rem;color:var(--muted);margin:0 0 4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:11px 20px;border-radius:999px;z-index:60;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.bad{background:var(--danger)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);max-width:520px;width:92vw;padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 6px}
dialog button.item{display:block;width:100%;text-align:left;padding:12px;border:0;background:transparent;border-radius:10px;cursor:pointer;font-size:.95rem}
dialog button.item:hover{background:var(--soft)}
.dock,.moreBtn{display:none}

/* ---------------- phones and small tablets ---------------- */
@media (max-width:820px){
  header.bar{padding:8px 14px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  header.bar .actions.desk{display:none}
  .moreBtn{display:inline-grid;place-items:center;width:42px;height:42px;padding:0;font-size:1.3rem;line-height:1}
  #dirty{font-size:.75rem}
  .layout{display:block;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
  nav.tabs{position:sticky;top:var(--bar);z-index:20;flex-direction:row;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs hr{display:none}
  nav.tabs button{flex:none;white-space:nowrap;padding:10px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);scroll-snap-align:start;min-height:42px}
  nav.tabs button.on{border-color:var(--acc)}
  main{padding:16px 14px 0}
  main h2{font-size:1.25rem}
  .field{padding:14px;border-radius:14px}
  .flabel{flex-direction:column;gap:2px}.flabel small{text-align:left}
  .cols2,.cols3{grid-template-columns:1fr}
  .row .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .row .tools .btn{min-height:44px;font-size:.9rem}
  .btn.sm{min-height:42px}
  .dock{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.08)}
  .dock .btn{min-height:48px;font-size:1rem}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom))}
  dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  #login{align-items:start;padding-top:9vh}
  .lcard{padding:28px 20px 22px;border-radius:22px}
}
@media (max-width:360px){.dock{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="loginmode">

<section id="login" class="hide">
  <div class="lcard">
    <img class="logo" src="/assets/logo-192.png" alt="" width="72" height="72" onerror="this.style.display='none'">
    <h1>Axomai Admin</h1>
    <p class="lsub">Sign in to edit the Axomai Browser website.</p>
    <form id="loginForm" autocomplete="on">
      <label for="pw">Password</label>
      <div class="pwwrap">
        <input id="pw" type="password" placeholder="Enter your password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
        <button type="button" id="showPw" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <div class="err" id="loginErr" role="alert" aria-live="polite"></div>
      <button class="btn" id="loginBtn">Log in</button>
    </form>
    <p class="lfoot">Private area for the site owner.</p>
  </div>
</section>

<div id="app" class="hide">
  <header class="bar">
    <h1><img src="/assets/logo-192.png" alt="" onerror="this.style.display='none'">Axomai admin</h1>
    <span id="dirty"></span>
    <div class="actions desk">
      <button class="btn alt" data-act="restore" type="button">Restore an older version</button>
      <button class="btn alt" data-act="preview" type="button">Preview</button>
      <button class="btn" data-act="publish" type="button">Publish</button>
      <button class="btn alt" data-act="logout" type="button">Log out</button>
    </div>
    <button class="btn alt moreBtn" id="moreBtn" type="button" aria-label="More">&#8943;</button>
  </header>
  <div class="layout">
    <nav class="tabs" id="tabs" aria-label="Pages"></nav>
    <main id="main"></main>
  </div>
  <div class="dock">
    <button class="btn alt" data-act="preview" type="button">Preview</button>
    <button class="btn" data-act="publish" type="button">Publish</button>
  </div>
</div>

<dialog id="moreDlg">
  <h3>Menu</h3>
  <button class="item" data-act="restore" type="button">Restore an older version</button>
  <button class="item" data-act="logout" type="button">Log out</button>
  <div style="text-align:right;margin-top:8px"><button class="btn alt" type="button" id="closeMore">Close</button></div>
</dialog>

<dialog id="restoreDlg">
  <h3>Restore an older version</h3>
  <p class="mini">Every publish keeps a copy of the version it replaced. Pick one to load it into the editor; nothing goes live until you press Publish.</p>
  <div id="backupList"></div>
  <div style="text-align:right;margin-top:10px"><button class="btn alt" id="closeDlg" type="button">Close</button></div>
</dialog>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const HEADERS = { 'Content-Type': 'application/json', 'X-Axomai-Admin': '1' };
async function api(path, body) {
  const r = await fetch('api/' + path, body === undefined ? { credentials: 'same-origin' } : { method: 'POST', headers: HEADERS, body: JSON.stringify(body), credentials: 'same-origin' });
  let j = {};
  try { j = await r.json(); } catch (e) { /* not JSON */ }
  if (r.status === 401 && path !== 'login') { showLogin(); throw new Error('Please log in again.'); }
  if (!r.ok) throw new Error(j.error || ('Error ' + r.status));
  return j;
}
function toast(msg, bad) {
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  t.setAttribute('role', 'status');
  document.body.appendChild(t);
  setTimeout(() => t.remove(), bad ? 7000 : 2600);
}
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v === true) e.setAttribute(k, ''); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}

// ---------------------------------------------------------------- what each field is called
const HF = ['nav', 'cta', 'cta_short', 'footer_note', 'foot_menu', 'foot_links', 'foot_lang', 'foot_rights', 'footer_links'];
const TABS = [
  { id: 'en', label: 'Home - English', title: 'Home page - English', lang: 'en', keys: (k) => !HF.includes(k), page: 'en' },
  { id: 'as', label: 'Home - Assamese', title: 'Home page - Assamese', lang: 'as', keys: (k) => !HF.includes(k), page: 'as' },
  { id: 'about', label: 'About page', title: 'About page', lang: 'about', keys: () => true, page: 'about' },
  { sep: true },
  { id: 'hf-en', label: 'Header & footer - English', title: 'Header & footer - English', lang: 'en', keys: (k) => HF.includes(k), page: 'en' },
  { id: 'hf-as', label: 'Header & footer - Assamese', title: 'Header & footer - Assamese', lang: 'as', keys: (k) => HF.includes(k), page: 'as' },
  { sep: true },
  { id: 'settings', label: 'Settings', title: 'Settings' },
];
const L = {
  title: ['Browser tab title', 'Shown in the tab and in Google results (SEO). Keep it under about 60 characters.'],
  desc: ['Search result description', 'Shown under the title in Google (SEO). About 150 characters.'],
  nav: ['Header menu links', 'The links at the top. Use #section for a part of the home page, /about/ for another page, or a full https:// address.'],
  cta: ['Download button text'], cta_short: ['Download button text on phones (short)'],
  eyebrow: ['Small label above the heading', 'Write & as &amp; in this one.'], h1: ['Main heading', 'You can colour a word with <em>word</em>.'], lead: ['Intro paragraph'],
  nowin_h: ['Note for phones and Macs: heading'], nowin_p: ['Note for phones and Macs: text'], nowin_btn: ['Note for phones and Macs: button'],
  cta_meta: ['Small text on the download button', 'Placeholders: {version} {size}'], secondary: ['Second button text'],
  fine: ['Small print under the buttons', 'Placeholders: {sha}. You can use <b> and <code>.'],
  shot_url: ['Demo window: address bar text'], shot_title: ['Demo window: title'], shot_sub: ['Demo window: subtitle'],
  chat: ['Demo chat messages', 'The first box says who speaks (user or ai).'], strip: ['Four small boxes under the demo'],
  def_kicker: ['"What is it" section: small label'], def_h: ['"What is it" section: heading'], def_p: ['"What is it" section: answer', 'You can use <b>bold</b>.'],
  facts_h: ['Facts table: heading'], facts: ['Facts table rows', 'Placeholders: {version} {size}'],
  features: ['Feature blocks', 'Edit the text. The blocks themselves are fixed.'],
  themes_h: ['Themes: heading'], themes_p: ['Themes: text'], themes: ['Theme names'],
  gallery_h: ['Pictures: heading'], gallery_note: ['Pictures: note'], gallery: ['Pictures: captions'],
  install_h: ['Install section: heading'], steps: ['Install steps', 'Placeholders: {version} {size}'], req_h: ['"Good to know": heading'], req: ['"Good to know" points'],
  faq_h: ['FAQ: heading'], faq: ['Questions and answers', 'Placeholders: {version} {size} {sha}'],
  final_h: ['Last banner: heading'], final_p: ['Last banner: text'],
  footer_note: ['Footer: short description'], foot_menu: ['Footer: menu column title'], foot_links: ['Footer: links column title'], foot_lang: ['Footer: language column title'],
  foot_rights: ['Footer: bottom line'], footer_links: ['Footer links column', 'Text, then the link address. {version} works in the download address.'],
  howto_name: ['Install steps title for search engines (SEO)'],
  crumb: ['Breadcrumb name'], h1_pre: ['Heading: normal part'], h1_em: ['Heading: coloured part'],
  chips: ['Small badges under the intro'], btn_download: ['Download button'], btn_visit: ['Second button (visit parent company)'],
  fam_parent_label: ['Parent card: label'], fam_parent_p: ['Parent card: text'], fam_product_label: ['Product card: label'], fam_product_p: ['Product card: text'],
  company_kicker: ['Company section: small label'], company_h: ['Company section: heading'], company_p1: ['Company paragraph 1', '{parent} turns into a link to Axom AI.'], company_p2: ['Company paragraph 2'],
  people: ['People cards', 'Initials, name, role.'], glance_h: ['"At a glance" card: heading'], glance: ['"At a glance" rows', 'aiaxom.co.in turns into a link.'],
  product_kicker: ['Product section: small label'], product_h: ['Product section: heading'], product_p: ['Product section: text'],
  why_kicker: ['"Why" section: small label'], why_h: ['"Why" section: heading'], why_p: ['"Why" section: text'], why_quote: ['"Why" section: quote'],
  facts_kicker: ['Facts: small label'], faq_kicker: ['FAQ: small label'], band_h: ['Last banner: heading'], band_p: ['Last banner: text'], band_btn: ['Last banner: button'],
};
const ROWS = {
  nav: ['Link address', 'Text'], footer_links: ['Text', 'Link address'], chat: ['Speaker', 'Message'], strip: ['Big text', 'Small text'], facts: ['Label', 'Value'],
  themes: ['Name', 'Colours (fixed)'], gallery: ['Image (fixed)', 'Picture description', 'Caption'], steps: ['Title', 'Text'], faq: ['Question', 'Answer'],
  vis: ['Icon', 'Text'], people: ['Initials', 'Name', 'Role'], glance: ['Label', 'Value'], features: ['Icon', 'Title', 'Text'],
};
const FIXED_LIST = new Set(['strip', 'themes', 'gallery', 'features', 'chat', 'steps']); // tied to the design: edit the text, not the number of items
const locked = (key, col) => (key === 'themes' && col === 1) || (key === 'gallery' && col === 0) || key === 'id';
const humanize = (k) => k.replace(/_/g, ' ').replace(/^./, (c) => c.toUpperCase());

// ---------------------------------------------------------------- state
let S = { def: null, cur: null, published: '', tab: 'en', release: null, backups: [] };
const clone = (x) => JSON.parse(JSON.stringify(x));
const snap = () => JSON.stringify(S.cur);
function refreshDirty() {
  const on = snap() !== S.published;
  const d = $('dirty');
  d.textContent = on ? 'Unpublished changes' : 'All published';
  d.className = on ? 'on' : '';
  document.querySelectorAll('.field[data-key]').forEach((f) => f._sync && f._sync());
}

// ---------------------------------------------------------------- editor widgets
function textBox(get, set, opts) {
  const t = el('textarea', { rows: 1, disabled: !!(opts && opts.locked) });
  t.value = get();
  const fit = () => { t.style.height = 'auto'; t.style.height = Math.min(Math.max(t.scrollHeight + 2, 42), 420) + 'px'; };
  t.addEventListener('input', () => { set(t.value); fit(); refreshDirty(); });
  setTimeout(fit, 0);
  return t;
}
function listTools(arr, i, redraw, fixed) {
  const b = (txt, fn, cls, dis) => el('button', { class: 'btn sm ' + (cls || 'alt'), type: 'button', onclick: () => { fn(); refreshDirty(); }, disabled: dis, title: txt }, txt);
  return el('div', { class: 'tools' },
    b('Up', () => { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; redraw(); }, 'alt', i === 0),
    b('Down', () => { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; redraw(); }, 'alt', i === arr.length - 1),
    fixed ? null : b('Delete', () => { if (arr.length > 1 && confirm('Delete this item?')) { arr.splice(i, 1); redraw(); } }, 'danger', arr.length < 2));
}
function blank(tpl) {
  if (typeof tpl === 'string') return '';
  if (Array.isArray(tpl)) return tpl.map(blank);
  return Object.fromEntries(Object.entries(tpl).map(([k, v]) => [k, blank(v)]));
}
// One list of items (text lines, rows of columns, or cards of fields).
function listEditor(arr, key, tpl, container) {
  const fixed = FIXED_LIST.has(key);
  const draw = () => {
    container.textContent = '';
    arr.forEach((item, i) => {
      if (Array.isArray(item)) {
        const labels = ROWS[key] || [];
        const row = el('div', { class: 'row cols' + Math.min(item.length, 3) }, item.map((v, c) => el('div', {}, el('div', { class: 'mini', text: labels[c] || '' }),
          textBox(() => item[c], (x) => { item[c] = x; }, { locked: locked(key, c) }))));
        row.append(listTools(arr, i, draw, fixed));
        container.append(row);
      } else if (item && typeof item === 'object') {
        const card = el('div', { class: 'card' }, el('h4', { text: (item.h || item.title || (key + ' ' + (i + 1))) }));
        for (const [fk, fv] of Object.entries(item)) card.append(fieldBlock(item, fk, fv, key, true));
        card.append(listTools(arr, i, draw, fixed));
        container.append(card);
      } else {
        container.append(el('div', { class: 'row cols1' }, textBox(() => arr[i], (x) => { arr[i] = x; }), listTools(arr, i, draw, fixed)));
      }
    });
    if (!fixed) container.append(el('button', { class: 'btn alt sm', type: 'button', onclick: () => { arr.push(blank(tpl)); draw(); refreshDirty(); } }, '+ Add'));
  };
  draw();
}
// A labelled block for one value inside an object.
function fieldBlock(obj, key, tplValue, topKey, nested) {
  const val = obj[key];
  const [label, hint] = (!nested && L[topKey]) ? L[topKey] : [humanize(key)];
  const wrap = el('div', { class: nested ? '' : 'field' });
  if (typeof val === 'string') {
    wrap.append(el('div', { class: 'flabel' }, nested ? humanize(key) : label, nested ? null : (hint ? el('small', { text: hint }) : null)));
    wrap.append(textBox(() => obj[key], (x) => { obj[key] = x; }, { locked: locked(key, -1) }));
  } else if (Array.isArray(val)) {
    wrap.append(el('div', { class: 'flabel' }, nested ? humanize(key) : label, nested ? null : (hint ? el('small', { text: hint }) : null)));
    const box = el('div');
    listEditor(val, nested ? (key === 'vis' ? 'vis' : key) : topKey, tplValue[0], box);
    wrap.append(box);
  }
  return wrap;
}

// ---------------------------------------------------------------- pages
function renderTab() {
  const main = $('main');
  main.textContent = '';
  document.querySelectorAll('#tabs button').forEach((b) => {
    const on = b.dataset.id === S.tab;
    b.classList.toggle('on', on);
    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'center' });
  });
  const tab = TABS.find((t) => t.id === S.tab);
  if (tab.id === 'settings') return renderSettings(main);
  main.append(el('h2', { text: tab.title }), el('p', { class: 'sub', text: 'Edit the text, tap Preview to see it, then Publish. The design stays the same.' }));
  const obj = S.cur[tab.lang], def = S.def[tab.lang];
  for (const key of Object.keys(def).filter(tab.keys)) {
    const f = fieldBlock(obj, key, def[key], key, false);
    f.dataset.key = key;
    f._isChanged = () => JSON.stringify(obj[key]) !== JSON.stringify(def[key]);
    const reset = el('button', { class: 'btn alt sm', type: 'button', onclick: () => { obj[key] = clone(def[key]); renderTab(); refreshDirty(); } }, 'Reset to original');
    const resetRow = el('div', { style: 'text-align:right;margin-top:8px' }, reset);
    f.append(resetRow);
    f._sync = () => { const c = f._isChanged(); f.classList.toggle('changed', c); resetRow.classList.toggle('hide', !c); };
    f._sync();
    main.append(f);
  }
  window.scrollTo(0, 0);
}
function renderSettings(main) {
  main.append(el('h2', { text: 'Settings' }));
  const cb = el('input', { type: 'checkbox', id: 'asRev', style: 'width:20px;height:20px;margin-right:10px;vertical-align:-4px' });
  cb.checked = !!S.cur.settings.as_reviewed;
  cb.addEventListener('change', () => { S.cur.settings.as_reviewed = cb.checked; refreshDirty(); });
  main.append(el('div', { class: 'field' },
    el('label', { class: 'flabel', for: 'asRev', style: 'justify-content:flex-start;align-items:center' }, cb, 'Let search engines index the Assamese page (/as/)'),
    el('p', { class: 'mini', text: 'Leave this off until a native Assamese speaker has read the page. When it is on, the page is added to the sitemap and the noindex tag is removed.' })));
  const r = S.release || {};
  main.append(el('div', { class: 'field' }, el('div', { class: 'flabel', text: 'Download details (automatic)' }),
    el('p', { class: 'mini', text: `Version ${r.version}, about ${r.size} MB. These come from the file release.json on the server, so they update on their own when you upload a new installer. Press Publish after uploading to refresh the pages.` })));
}

// ---------------------------------------------------------------- actions
function content() { return { en: S.cur.en, as: S.cur.as, about: S.cur.about, settings: S.cur.settings }; }
function busy(on, label) {
  document.querySelectorAll('[data-act=preview],[data-act=publish],[data-act=restore]').forEach((b) => { b.disabled = on; });
  document.querySelectorAll('[data-act=publish]').forEach((b) => { if (b.classList.contains('item')) return; b.textContent = on && label === 'publish' ? 'Publishing...' : 'Publish'; });
  document.querySelectorAll('[data-act=preview]').forEach((b) => { b.textContent = on && label === 'preview' ? 'Building...' : 'Preview'; });
}
async function preview() {
  const tab = TABS.find((t) => t.id === S.tab);
  const page = (tab && tab.page) || 'en';
  const win = window.open('about:blank', '_blank');
  busy(true, 'preview');
  try {
    await api('preview', { content: content() });
    if (win) win.location = 'preview/' + page; else toast('Allow pop-ups for this page to see the preview.', true);
  } catch (e) { if (win) win.close(); toast(e.message, true); } finally { busy(false); }
}
async function publish() {
  if (!confirm('Publish these changes to the live website now?')) return;
  busy(true, 'publish');
  try {
    const r = await api('publish', { content: content() });
    S.published = snap(); S.backups = r.backups || S.backups; refreshDirty();
    toast('Published. The website is updated.');
  } catch (e) { toast(e.message, true); } finally { busy(false); }
}
function openRestore() {
  if ($('moreDlg').open) $('moreDlg').close();
  const list = $('backupList');
  list.textContent = '';
  if (!S.backups.length) list.append(el('p', { class: 'mini', text: 'No older versions yet. They appear after your first publish.' }));
  for (const name of S.backups) {
    const when = name.replace(/^overrides-/, '').replace(/\.json$/, '').replace(/T(\d\d)-(\d\d)-(\d\d).*/, ' $1:$2:$3 (UTC)');
    list.append(el('button', { class: 'item', type: 'button', onclick: async () => {
      try {
        const r = await api('backup?name=' + encodeURIComponent(name));
        S.cur = r.current; renderTab(); refreshDirty(); $('restoreDlg').close();
        toast('Loaded. Tap Preview or Publish.');
      } catch (e) { toast(e.message, true); }
    } }, when));
  }
  $('restoreDlg').showModal();
}
async function logout() {
  if ($('moreDlg').open) $('moreDlg').close();
  try { await api('logout', {}); } catch (e) { /* ignore */ }
  showLogin();
}

// ---------------------------------------------------------------- start
function showLogin() {
  document.body.classList.add('loginmode');
  $('app').classList.add('hide'); $('login').classList.remove('hide'); $('pw').value = ''; $('pw').focus();
}
async function showApp() {
  const d = await api('content');
  S = Object.assign(S, { def: d.defaults, cur: d.current, release: d.release, backups: d.backups });
  S.published = snap();
  document.body.classList.remove('loginmode');
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  const tabs = $('tabs');
  tabs.textContent = '';
  for (const t of TABS) {
    if (t.sep) { tabs.append(el('hr')); continue; }
    tabs.append(el('button', { 'data-id': t.id, type: 'button', onclick: () => { S.tab = t.id; renderTab(); } }, t.label));
  }
  renderTab(); refreshDirty();
}
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('loginErr'), btn = $('loginBtn');
  err.textContent = ''; err.classList.remove('shake');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try { await api('login', { password: $('pw').value }); await showApp(); }
  catch (x) { err.textContent = x.message; void err.offsetWidth; err.classList.add('shake'); $('pw').select(); }
  finally { btn.disabled = false; btn.textContent = 'Log in'; }
});
$('showPw').addEventListener('click', () => {
  const t = $('pw'), show = t.type === 'password';
  t.type = show ? 'text' : 'password';
  $('showPw').textContent = show ? 'Hide' : 'Show';
  $('showPw').setAttribute('aria-pressed', String(show));
  t.focus();
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  ({ preview, publish, restore: openRestore, logout })[b.dataset.act]();
});
$('moreBtn').onclick = () => $('moreDlg').showModal();
$('closeMore').onclick = () => $('moreDlg').close();
$('closeDlg').onclick = () => $('restoreDlg').close();
window.addEventListener('beforeunload', (e) => { if (S.cur && snap() !== S.published) { e.preventDefault(); e.returnValue = ''; } });
(async () => {
  try {
    const s = await api('status');
    if (!s.configured) { showLogin(); $('loginErr').textContent = 'The password has not been set yet.'; return; }
    if (s.authed) await showApp(); else showLogin();
  } catch (e) { showLogin(); }
})();
</script>
</body>
</html>
