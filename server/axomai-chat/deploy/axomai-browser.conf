# axomai-browser.aiaxom.co.in - download page, installer files, and the chat proxy (port 8011)

server {
    include /etc/nginx/snippets/favicon.conf;
    listen 80;
    listen [::]:80;
    server_name axomai-browser.aiaxom.co.in;

    include /etc/nginx/snippets/cloudflare-realip.conf;
    return 301 https://$host$request_uri;
}

server {
    include /etc/nginx/snippets/favicon.conf;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name axomai-browser.aiaxom.co.in;

    # Wildcard Origin CA cert covers *.aiaxom.co.in
    ssl_certificate     /etc/ssl/cloudflare/aiaxom.pem;
    ssl_certificate_key /etc/ssl/cloudflare/aiaxom.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    access_log /var/log/nginx/axomai-browser.access.log main;
    error_log  /var/log/nginx/axomai-browser.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    root /var/www/axomai-browser/site;
    index index.html;

    # The chat proxy. Small bodies only; answers are streamed, so no buffering.
    location /v1/ {
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
    }

    # Installer, its checksum and release.json (what the browser's update check reads).
    location /downloads/ {
        alias /var/www/axomai-browser/downloads/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
