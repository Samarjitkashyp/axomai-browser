[package]
name = "axomai_engine"
version = "1.6.0"
edition = "2021"
authors = ["Samarjit Kashyap <samarjitkashyp@gmail.com>"]
description = "High-performance Rust Browser Engine for Axomai Browser"

[lib]
name = "axomai_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
ureq = { version = "2.9", features = ["tls"] }
html-escape = "0.2"
v8 = "152.2.0"
wgpu = { version = "0.19", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }
pollster = { version = "0.3", optional = true }

[features]
default = []
wgpu-backend = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]
